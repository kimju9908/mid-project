spring.application.name=BackendCapstone

server.port=8111
server.address=0.0.0.0

# ===================== Database (AWS RDS) =====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.initializationFailTimeout=60000

# ===================== JPA =====================
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ===================== Mail =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=rlawngur9908@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================== OAuth2 - Google =====================
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.registration.google.client-id=266505234391-ohlkh1sfttlkp91vjg47rfnvio3cpehk.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_post

# ===================== OAuth2 - Kakao =====================
spring.security.oauth2.client.registration.kakao.client-id=8fccbb50d2dfd7791b73ed78df3fb2b6
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ===================== OAuth2 - Naver =====================
spring.security.oauth2.client.registration.naver.client-id=dvnjOtAvQ9WGtWd1Xqgv
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=email
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ===================== JWT =====================
jwt.secret=${JWT_SECRET}

# ===================== Nurigo SMS =====================
nurigo.api-key=${NURIGO_API_KEY}
nurigo.api-secret=${NURIGO_API_SECRET}
nurigo.sender=${NURIGO_SENDER}

# ===================== Flask =====================
app.flask.base-url=${FLASK_BASE_URL:http://flask-service:5000}

# ===================== 파일 업로드 =====================
spring.servlet.multipart.location=/tmp/pictures/
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB

# ===================== CODEF =====================
codef.api.url=https://development.codef.io/v1/kr/bank/a/account/transfer-authentication
codef.api.client-id=${CODEF_CLIENT_ID}
codef.api.secret-key=${CODEF_SECRET_KEY}

# ===================== Session =====================
server.servlet.session.timeout=30m
spring.devtools.restart.enabled=false
